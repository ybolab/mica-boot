name: release
# Every push to main that passes the gates publishes this commit's tree as the
# source artifact ghcr.io/ybolab/mica-boot:source.build-<commit12>, in the
# package named after this repository, with this workflow's own token;
# consumers pin it with `tools/deps.sh bump mica-boot`. Publishing is CI's:
# a developer machine does not push.
#
# A manual run publishes one earlier commit of main instead, transport only:
# `revision` is the full commit id and `expect_sha256` the digest a consumer
# already pins. The archive is that commit's tree alone -- not this
# checkout's -- and nothing is written unless it is byte-identical to the
# expected digest. The gates are not rerun for it: they ran for that commit
# when it landed, and its tree is what is being carried, unchanged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: full 40-hex commit id of main to publish as source.build-<commit12>
        required: true
      expect_sha256:
        description: the sha256 a consumer already pins for that commit's archive
        required: true
permissions:
  contents: read
  packages: write
jobs:
  source:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the build substrate at its pin
        run: make deps
      - name: The builder images this tooling runs in
        run: make build-env
      - name: Lint and the tooling's tests
        run: make check
      - name: Publish this commit as its source artifact
        if: github.event_name == 'push'
        run: make publish-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICA_REGISTRY_USER: ${{ github.actor }}
  transport:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish the requested commit as its source artifact
        run: bash tools/deps.sh publish-source --revision "${SOURCE_REVISION}" --expect-sha256 "${EXPECT_SHA256}"
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
          EXPECT_SHA256: ${{ inputs.expect_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICA_REGISTRY_USER: ${{ github.actor }}
